version: "3.8"

services:
  spark-thrift:
    container_name: spark-thrift
    build:
      context: ./docker/spark
      dockerfile: Dockerfile
    ports:
      - "10000:10000"
      - "4040:4040"
    depends_on:
      spark-hive-metastore:
        condition: service_healthy
      rustfs-setup:
        condition: service_completed_successfully
    command: >
      --class org.apache.spark.sql.hive.thriftserver.HiveThriftServer2
      --name Thrift JDBC/ODBC Server
    healthcheck:
      test:
        [
          "CMD",
          "beeline",
          "-u",
          "jdbc:hive2://localhost:10000",
          "-n",
          "dbt",
          "--silent=true",
          "-e",
          "select 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - spark-warehouse:/opt/spark/work-dir/spark-warehouse
      - ./docker/spark/hive-site.xml:/opt/spark/conf/hive-site.xml
      - ./docker/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf

  spark-hive-metastore:
    image: postgres:15-alpine
    volumes:
      - hive-metastore:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=dbt
      - POSTGRES_PASSWORD=dbt
      - POSTGRES_DB=metastore
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U dbt -d metastore"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible storage for external seed tables.
  rustfs:
    image: rustfs/rustfs:1.0.0
    container_name: spark-rustfs
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - RUSTFS_ACCESS_KEY=rustfs
      - RUSTFS_SECRET_KEY=rustfs123
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - rustfs-data:/data

  rustfs-setup:
    image: rustfs/rc:v0.1.36
    container_name: spark-rustfs-setup
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      set -e;
      rc alias set local http://rustfs:9000 rustfs rustfs123;
      rc bucket create --ignore-existing local/spark-seeds;
      echo 'Bucket spark-seeds created.';
      "

volumes:
  spark-warehouse:
  hive-metastore:
  rustfs-data:
